# Add this Match block to an sshd_config.d file only after reviewing the host config.
# ChrootDirectory must be root-owned and not writable by the SFTP user.
Match User axapta_sftp
    ChrootDirectory /srv/sftp/%u
    ForceCommand internal-sftp -d /upload
    PasswordAuthentication yes
    AllowTcpForwarding no
    X11Forwarding no
    PermitTTY no
