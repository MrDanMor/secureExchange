<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/secure-file-exchange/public

    <Directory /var/www/secure-file-exchange/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # Exchange data is outside DocumentRoot; this explicit denial is defense in depth.
    <Directory /srv/axapta-exchange>
        Require all denied
        Options -Indexes -ExecCGI
        AllowOverride None
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/secure-file-exchange-error.log
    CustomLog ${APACHE_LOG_DIR}/secure-file-exchange-access.log combined
</VirtualHost>
